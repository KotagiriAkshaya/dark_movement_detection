<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dark Room Movement Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:640px">
  <h2 class="mb-1">Dark Room Movement Detector</h2>
  <p class="text-muted">Upload a video. The app brightens it and highlights human movement.</p>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="alert alert-warning">{{ m }}</div>{% endfor %}
  {% endwith %}

  <form method="post" enctype="multipart/form-data" id="f" class="card card-body shadow-sm">
    <label class="form-label">Video file (max 25 MB, first 60 seconds analysed)</label>
    <input class="form-control mb-3" type="file" name="video" accept="video/*" required>

    <label class="form-label">Sensitivity (lower = more sensitive)</label>
    <input class="form-range mb-3" type="range" name="sensitivity" min="500" max="5000" step="100" value="1500">

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" name="simulate" id="sim">
      <label class="form-check-label" for="sim">Simulate darkness (use this for normal, bright videos)</label>
    </div>

    <label class="form-label">Darkness level (only used if simulating)</label>
    <select class="form-select mb-3" name="brightness">
      <option value="0.5">Dim (50% brightness)</option>
      <option value="0.25" selected>Dark (25% brightness)</option>
      <option value="0.1">Very dark (10% brightness)</option>
    </select>

    <button class="btn btn-primary" id="btn">Analyse video</button>
  </form>
  <a href="/history" class="d-block mt-3">View history</a>
</div>
<script>
  document.getElementById('f').addEventListener('submit', () => {
    const b = document.getElementById('btn');
    b.disabled = true; b.innerText = 'Processing... please wait (this can take a minute or two)';
  });
</script>
</body>
</html>
