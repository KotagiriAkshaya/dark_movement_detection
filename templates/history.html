<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h3>Past analyses</h3>
  <div style="overflow-x:auto">
  <table class="table table-striped bg-white">
    <thead><tr><th>#</th><th>File</th><th>Simulated dark</th><th>Duration</th><th>Seconds with humans</th><th>Date</th><th></th></tr></thead>
    <tbody>
    {% for r in runs %}
      <tr>
        <td>{{ r.id }}</td><td>{{ r.original_name }}</td>
        <td>{{ "Yes" if r.simulated else "No" }}</td>
        <td>{{ r.duration }} s</td><td>{{ r.human_seconds }}</td><td>{{ r.created }}</td>
        <td><a href="/results/{{ r.result_video }}" target="_blank">Watch</a></td>
      </tr>
    {% else %}
      <tr><td colspan="7">Nothing yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
  <a href="/" class="btn btn-primary">Back</a>
</div>
</body>
</html>
